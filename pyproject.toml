[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biobirddna-genetics"
version = "0.2.0"
description = "BioBirdDNA breeding-record normalization, deterministic genetics simulation, candidate-model recovery, pedigree control, and phenotype-only screening."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Biologicalbird Community / TAICHEL"}]
dependencies = []

[project.scripts]
biobirddna-genetics = "biobirddna_genetics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
